name: TaraSec

options:
  bundleIdPrefix: org.tarasec
  deploymentTarget:
    iOS: "16.0"

settings:
  base:
    SWIFT_VERSION: "5.0"

targets:
  TaraSec:
    type: application
    platform: iOS
    sources:
      - path: TaraSec
    info:
      path: TaraSec/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.tarasec.app.ios
        PRODUCT_NAME: TaraSec
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
    scheme:
      testTargets: []
